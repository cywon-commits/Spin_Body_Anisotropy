[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sbaniso"
version = "0.1.0"
description = "Spin bodies under uniaxial anisotropy: axis selection and the Ising-KT crossing (Paper II)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "numba", "matplotlib", "pyyaml", "h5py"]

[project.optional-dependencies]
test = ["pytest"]
# Full spin-body model (task T2): polyspin with the anisotropy extension, pinned to a tag.
# Tag v0.2.0-aniso on branch anisotropy-extension of Polyhedron_Spin_Group (not merged into Paper I's
# default branch, per CLAUDE.md).
fullmodel = ["polyspin @ git+https://github.com/cywon-commits/Polyhedron_Spin_Group@v0.2.0-aniso"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: multi-minute statistical tests",
    "validation: N0 physics gates (need data/n0/validation_summary.json)",
]
